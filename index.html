<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIA Secure Archive</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="terminal-shell" id="app" aria-live="polite">
      <section class="panel panel--login" id="login-screen">
        <div class="brand">
          <p class="brand__mark">FIA</p>
          <p class="brand__name">FRONTIER INTELLIGENCE ARCHITECTURE</p>
        </div>

        <div class="access-card">
          <h1>SECURE ARCHIVE</h1>
          <form id="access-form" autocomplete="off">
            <label for="access-code">ENTER ACCESS CODE</label>
            <div class="access-row">
              <input id="access-code" name="access-code" type="text" spellcheck="false" autofocus />
              <button type="submit">VERIFY</button>
            </div>
            <p class="error-message" id="access-error" role="alert"></p>
          </form>
        </div>
      </section>

      <section class="panel panel--archive is-hidden" id="archive-screen">
        <div class="terminal-output" id="terminal-output"></div>
        <div class="interaction" id="interaction"></div>
      </section>
    </main>

    <div class="piece-modal" id="piece-modal" hidden>
      <div class="piece-modal-backdrop"></div>
      <div class="piece-modal-panel" id="piece-modal-panel" role="dialog" aria-modal="true" aria-labelledby="piece-title">
        <p class="piece-modal-kicker">FILE BREACH · FRAGMENT RECOVERED</p>
        <h2 id="piece-title">Theseus — Piece 3</h2>
        <div class="piece-modal-frame" id="piece-modal-frame">
          <img src="./piece_3.png" alt="Project Theseus fragment piece 3" id="piece-image" />
          <div class="piece-shards" id="piece-shards" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <div class="alarm-overlay" id="alarm-overlay" hidden aria-hidden="true">
      <div class="alarm-banner">⚠ SYSTEM ALERT</div>
      <div class="alarm-text">UNAUTHORIZED FRAGMENT TRANSFER</div>
      <div class="alarm-sub">CONTAINMENT FAILURE · ARCHIVE COMPROMISED</div>
    </div>

    <div class="blackout-veil" id="blackout-veil" hidden aria-hidden="true"></div>

    <noscript>
      <p class="noscript">这个页面需要启用 JavaScript 才能访问 FIA Secure Archive。</p>
    </noscript>

    <script src="./script.js"></script>
  </body>
</html>
